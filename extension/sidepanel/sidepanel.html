<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trace</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="sp-header">
    <div class="sp-brand">
      <img class="sp-logo" src="../icons/trace.svg" alt="" width="28" height="28">
      <span class="sp-title">Trace</span>
    </div>
    <div id="sp-status-chip" class="sp-status-chip">
      <span class="sp-dot"></span>
      <span id="sp-status-text">준비됨</span>
    </div>
  </header>

  <main class="sp-content">
    <section class="sp-section active">
      <div class="sp-card">
        <div class="sp-card-title"><span>🤖 LLM 모델</span><button id="sp-btn-nano-download" class="sp-btn secondary small" type="button" hidden>모델 받기</button></div>
        <p id="sp-nano-status" class="sp-desc" role="status">모델 상태 확인 중…</p>
        <progress id="sp-nano-progress" max="100" value="0" hidden style="width:100%"></progress>
      </div>

      <div class="sp-card">
        <div class="sp-card-title">
          <span>🧠 이번 전송에 들어갈 기억</span>
          <button id="sp-btn-sync" class="sp-btn secondary small" type="button">새로고침</button>
        </div>
        <div id="sp-matched-preview" class="sp-list"></div>
      </div>

      <div class="sp-card">
        <div class="sp-card-title">
          <span>📡 모델 레이더</span>
          <button id="sp-btn-refresh-radar" class="sp-btn secondary small" type="button">새로고침</button>
        </div>
        <div id="sp-radar-list" class="sp-list"></div>
      </div>

      <p class="sp-desc">기억 목록·로어북·설정은 크랙 화면의 Trace 창에 있습니다.</p>
    </section>
  </main>

  <script src="../llm/host.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
